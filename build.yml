name: Windows EXE Derle

on:
  push:
  workflow_dispatch:

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Program klasörünü oluştur
        run: pyinstaller --noconfirm --clean AkademikIndirici.spec

      - name: Claude uzantısını paketle
        run: .\dist\AkademikIndirici\AkademikKutuphaneMCP.exe --mcpb-pack dist\AkademikIndirici dist\akademik-kutuphane.mcpb

      - uses: actions/upload-artifact@v7
        with:
          name: AkademikIndirici
          path: dist/AkademikIndirici/
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: Claude-uzantisi
          path: dist/akademik-kutuphane.mcpb
          if-no-files-found: error
